<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TradingAI - AI-powered trading platform with real-time market data, intelligent insights, and beautiful responsive design for desktop and mobile.">
    <meta name="keywords" content="trading, stocks, AI, market data, real-time, charts, analysis">
    <meta name="theme-color" content="#667eea">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="TradingAI - Smart Trading Platform">
    <meta property="og:description" content="Empower your trades with real-time data and AI-powered insights">

    <title>TradingAI - Smart Trading Platform</title>

    <style>
      /* Global Reset and Base Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        scroll-behavior: smooth;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        color: #1a202c;
        background: #ffffff;
        overflow-x: hidden;
      }

      #app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 5px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
      }

      /* Selection Color */
      ::selection {
        background: #667eea;
        color: white;
      }

      ::-moz-selection {
        background: #667eea;
        color: white;
      }

      /* Loading Animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      #app {
        animation: fadeIn 0.3s ease-in;
      }

      /* Utility Classes */
      .text-gradient {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Focus Styles for Accessibility */
      *:focus {
        outline: 2px solid #667eea;
        outline-offset: 2px;
      }

      button:focus,
      a:focus {
        outline: 2px solid #667eea;
        outline-offset: 2px;
      }

      /* Responsive Images */
      img {
        max-width: 100%;
        height: auto;
        display: block;
      }

      /* Smooth Transitions */
      a, button, input, select, textarea {
        transition: all 0.3s ease;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
